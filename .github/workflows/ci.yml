name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy src
      - run: pytest --cov=replayweave --cov-report=term-missing
      - run: python -m build --wheel --sdist
      - run: replayweave check examples/checkout.bundle.json
      - run: replayweave replay examples/checkout.bundle.json --mode fixture
