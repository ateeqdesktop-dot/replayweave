[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "replayweave"
version = "0.1.0"
description = "Local-first replay bundles and semantic regression gates for distributed workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ReplayWeave contributors" }]
dependencies = [
  "click>=8.1,<9",
  "jsonschema>=4.22,<5",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
]

[project.scripts]
replayweave = "replayweave.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/replayweave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.coverage.run]
source = ["replayweave"]
branch = true
